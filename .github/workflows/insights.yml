name: Ler desempenho dos posts

# Só lê métricas dos posts. Não publica nada nem grava no repositório.

on:
  push:
    branches: [main]
    paths: [".github/workflows/insights.yml", "scripts/insights.py"]
  workflow_dispatch:

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests==2.32.3
      - name: Métricas dos posts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION || 'v23.0' }}
        run: python scripts/insights.py
