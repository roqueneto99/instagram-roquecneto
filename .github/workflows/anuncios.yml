name: Listar anúncios (só leitura)

on:
  workflow_dispatch:

jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Campanhas, conjuntos e anúncios
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
        run: python scripts/anunciar.py listar
