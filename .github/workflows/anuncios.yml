name: Listar anúncios (só leitura)

on:
  workflow_dispatch:
    inputs:
      teste_media_id:
        description: "Se preenchido, cria um anúncio PAUSADO com esse post em cada conjunto e apaga (não gasta)"
        type: string
        default: ""

jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Campanhas, conjuntos e anúncios
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
        run: python scripts/anunciar.py listar
      - name: Teste de criação (pausado e apagado)
        if: inputs.teste_media_id != ''
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
        run: python scripts/anunciar.py teste "${{ inputs.teste_media_id }}"
